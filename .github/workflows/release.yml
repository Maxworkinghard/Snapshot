# 推送 v* tag（或手工 workflow_dispatch）后，用 Tauri 为 macOS / Windows / Linux 三端打附件，
# 合成 SHA256SUMS.txt，并创建 **draft + pre-release**。不会直接公开。
# 人工检查附件与说明后再在 GitHub 上点 Publish。
# 手工触发时 platforms 选 windows，只打 Windows、只发 Windows 附件（macOS / Linux 稍后），
# 发布说明换用 release-notes-windows.md。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.1.0"
        required: true
        type: string
      platforms:
        description: "all：三端一起发；windows：只发 Windows"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "error: version '$VERSION' is not like 0.1.0" >&2
            exit 1
          fi
          # 附件名取自 tag，但包内版本号来自 tauri.conf.json，两边不一致会发出对不上号的包
          CONF_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          FILE_VERSION="$(tr -d ' \n\r' < VERSION)"
          if [ "$CONF_VERSION" != "$VERSION" ] || [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "error: tag $VERSION != tauri.conf.json $CONF_VERSION != VERSION $FILE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 推 tag 触发时没有这个输入，一律三端
          echo "platforms=${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    if: needs.version.outputs.platforms == 'all'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      # beforeBuildCommand 会顺带把 ScreenCaptureKit 录制桥编成 universal sidecar
      - name: Build universal app bundle
        run: npm run tauri build -- --target universal-apple-darwin --bundles app
      - name: Verify slices and pack zip
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/snapshot.app"
          test -d "$APP" || { echo "error: missing $APP" >&2; exit 1; }
          # 主程序和录制 sidecar 都必须是双切片，少一个就不是 universal 包
          for bin in "$APP/Contents/MacOS/snapshot" "$APP/Contents/MacOS/snapshot-recorder"; do
            ARCHS="$(lipo -archs "$bin")"
            echo "$bin: $ARCHS"
            case "$ARCHS" in *arm64*) ;; *) echo "error: $bin 缺 arm64 切片" >&2; exit 1 ;; esac
            case "$ARCHS" in *x86_64*) ;; *) echo "error: $bin 缺 x86_64 切片" >&2; exit 1 ;; esac
          done
          mkdir -p dist/release
          ditto -c -k --keepParent "$APP" "dist/release/snapshot-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/release/snapshot-*-macos-universal.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - run: npm ci
      - name: Build x64 installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Build ARM64 installer
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for pair in "x86_64-pc-windows-msvc x64" "aarch64-pc-windows-msvc arm64"; do
            set -- $pair
            SRC="src-tauri/target/$1/release/bundle/nsis/snapshot_${VERSION}_$2-setup.exe"
            test -f "$SRC" || { echo "error: missing $SRC" >&2; ls -la "src-tauri/target/$1/release/bundle/nsis" || true; exit 1; }
            cp "$SRC" "dist/release/snapshot-${VERSION}-windows-$2.exe"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/release/snapshot-*-windows-x64.exe
            dist/release/snapshot-*-windows-arm64.exe
          if-no-files-found: error

  # 在干净的 Windows 上静默安装 x64 安装包、启动、活过 15 秒、再卸载，过不了就不进发布草稿。
  # ARM64 包没有冒烟：公开仓库用不上 GitHub 托管的 Windows ARM64 机器
  windows-smoke:
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: packages
      - name: Install, launch and uninstall
        shell: pwsh
        run: ./scripts/windows/smoke-test.ps1 -Installer "packages/snapshot-${{ needs.version.outputs.version }}-windows-x64.exe"

  # 在 Ubuntu 22.04 上打 deb + AppImage，再到 22.04 / 24.04 上各装一遍、起一遍，见 linux-packages.yml
  linux:
    needs: version
    if: needs.version.outputs.platforms == 'all'
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, macos, windows, windows-smoke, linux]
    # 只发 Windows 时 macOS / Linux 是跳过的，照样往下走；三端一起发时哪一端没成功都不发
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.windows.result == 'success'
      && needs.windows-smoke.result == 'success'
      && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && needs.version.outputs.platforms == 'windows'))
      && (needs.linux.result == 'success' || (needs.linux.result == 'skipped' && needs.version.outputs.platforms == 'windows')) }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORMS: ${{ needs.version.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true
      - name: Verify set and checksums
        working-directory: dist/release
        run: |
          set -euo pipefail
          expected=(
            "snapshot-${VERSION}-windows-x64.exe"
            "snapshot-${VERSION}-windows-arm64.exe"
          )
          if [ "$PLATFORMS" = "all" ]; then
            expected+=(
              "snapshot-${VERSION}-macos-universal.zip"
              "snapshot-${VERSION}-linux-x86_64.deb"
              "snapshot-${VERSION}-linux-x86_64.AppImage"
              "snapshot-${VERSION}-linux-aarch64.deb"
              "snapshot-${VERSION}-linux-aarch64.AppImage"
            )
          fi
          for f in "${expected[@]}"; do
            test -f "$f" || { echo "missing $f" >&2; ls -la; exit 1; }
          done
          sha256sum "${expected[@]}" | tee SHA256SUMS.txt
          # 下一步按这份清单上传，和上面校验的是同一组文件
          printf '%s\n' "${expected[@]}" SHA256SUMS.txt > ../assets.txt
      - name: Render notes
        run: |
          template=.github/release-notes.md
          if [ "$PLATFORMS" = "windows" ]; then template=.github/release-notes-windows.md; fi
          sed "s/{{VERSION}}/${VERSION}/g" "$template" > /tmp/release-notes.md
      - name: Create draft pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t names < dist/assets.txt
          assets=("${names[@]/#/dist/release/}")
          # tag 还不存在时（手工触发），发布那一刻才会建出来；钉在这次构建的提交上，免得打到那时 main 的最新提交
          gh release create "$TAG" "${assets[@]}" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "应用快照 ${VERSION}" \
            --notes-file /tmp/release-notes.md
