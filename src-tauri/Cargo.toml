[package]
name = "snapshot"
version = "0.1.1"
description = "统一的应用快照、Prompt 润色、桌宠和快捷键桌面端"
authors = ["App Snapshot"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Maxworkinghard/Snapshot"
edition = "2021"

[lib]
name = "snapshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock"] }
dirs = "7"
# 走路动作改成原地走时重新编码 GIF；image 本来就依赖它，不新增 crate
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"
# media:// 协议的路径解码；依赖树里本来就有（url 用它），不新增 crate
percent-encoding = "2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
xcap = "0.9.8"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AXUIElement 用于还原最小化窗口
core-foundation = "0.10"
# NSRunningApplication.icon 用于「上一个应用」图标
objc2 = "0.6"
# NSGraphics/NSGraphicsContext/NSImageRep：把图标画进 64×64 的 NSBitmapImageRep 再导出 PNG
# NSCursor：静帧截图合成光标（取当前系统光标的位图与热点）
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSCursor", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSImage", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary"] }

[target.'cfg(windows)'.dependencies]
# 窗口录制：Windows.Graphics.Capture 取帧 + Media Foundation 编码。
# WGC 是 WinRT，需要 windows 而非 windows-sys
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell"
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
